name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Instala pnpm en la versión fijada por el campo "packageManager" del package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # --frozen-lockfile falla si el pnpm-lock.yaml no está actualizado (equivalente a npm ci).
        run: pnpm install --frozen-lockfile

      - name: Tests (Vitest)
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          VITE_API_URL: http://localhost:8000
          VITE_REVERB_APP_KEY: ci-placeholder
