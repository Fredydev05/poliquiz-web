name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests (Vitest)
        run: npx vitest run --passWithNoTests

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8000
          VITE_REVERB_APP_KEY: ci-placeholder
